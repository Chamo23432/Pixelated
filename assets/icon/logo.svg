<!-- Pixelated logo, built in code so it scales cleanly at any size.
     Usage: copy the <svg>...</svg> block wherever the logo is needed,
     or reference logo.html via an <object>/<iframe> if you prefer a file. -->
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="pixelated-logo">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c6ff"/>
      <stop offset="55%" stop-color="#3f6bff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- fading pixel dots -->
  <rect x="14" y="20" width="9" height="9" rx="1.5" fill="#22c6ff"/>
  <rect x="24" y="30" width="8" height="8" rx="1.5" fill="#2ea3f5" opacity="0.92"/>
  <rect x="12" y="40" width="8" height="8" rx="1.5" fill="#3a86f0" opacity="0.85"/>
  <rect x="26" y="42" width="9" height="9" rx="1.5" fill="#3f6bff" opacity="0.9"/>
  <rect x="16" y="52" width="8" height="8" rx="1.5" fill="#4f6bf5" opacity="0.75"/>
  <rect x="12" y="62" width="8" height="8" rx="1.5" fill="#5a63f0" opacity="0.6"/>

  <!-- P shape -->
  <path d="M42 18
           H62
           C74 18 82 27 82 39
           C82 51 74 60 62 60
           H50
           V90
           L42 82
           Z"
        fill="url(#pGrad)"/>
</svg>
